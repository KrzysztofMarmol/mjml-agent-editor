name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      # apps/example builds a Supabase client at module scope, so the build needs these to
      # be syntactically valid URLs/keys. Nothing is contacted: no page fetches at build
      # time, and the values are obvious placeholders rather than a real project.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # `packages/agent-core/contract/tools.json` is generated by the build and committed,
      # and both backends read the committed copy. The unit test that guards it compares
      # against that same file, so after a build it is comparing the artifact with itself
      # and can never fail. This is the check that actually catches an uncommitted schema
      # change.
      - name: Contract artifact is committed
        run: git diff --exit-code -- packages/agent-core/contract/tools.json

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm format:check

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-python
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent-python/uv.lock

      - run: uv sync --frozen

      - run: uv run ruff check .

      # No `pnpm build` first: the tests read the committed contract artifact, which is what
      # the deployed service reads too. The typescript job above is what proves that file is
      # in sync with the source it is generated from.
      - run: uv run pytest
