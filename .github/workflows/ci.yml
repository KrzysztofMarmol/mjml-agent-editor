name: CI

on:
  # Every branch, not just main. Development happens on a long-lived branch while the
  # monorepo settles, and a workflow that only watches main would sit idle through exactly
  # the period it is most needed.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      # apps/example builds its Supabase clients and resolves the agent model at module
      # scope, so Next.js collecting page data for /api/chat throws on any of these being
      # absent. Nothing is contacted at build time; every value is an obvious placeholder.
      #
      # These must stay in step with the `env` list in turbo.json — Turborepo runs tasks in
      # strict env mode, so a variable set here is invisible to the task unless it is
      # declared there as well.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # `packages/agent-core/contract/tools.json` is generated by the build and committed,
      # and both backends read the committed copy. The unit test that guards it compares
      # against that same file, so after a build it is comparing the artifact with itself
      # and can never fail. This is the check that actually catches an uncommitted schema
      # change.
      - name: Contract artifact is committed
        run: git diff --exit-code -- packages/agent-core/contract/tools.json

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm format:check

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-python
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: agent-python/uv.lock

      - run: uv sync --frozen

      - run: uv run ruff check .

      # No `pnpm build` first: the tests read the committed contract artifact, which is what
      # the deployed service reads too. The typescript job above is what proves that file is
      # in sync with the source it is generated from.
      - run: uv run pytest
